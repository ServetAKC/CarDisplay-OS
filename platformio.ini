; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   cyd2usb                    normal build for the 2-USB Cheap Yellow Display
;   cyd                        same board, non-inverted panel
;   cyd2usb_font_installer     one-time helper that copies the Japanese font
;                              onto the SD card (see JAPONCA_KURULUM.txt)
;   native                     host build of the Arduino-free modules, used by
;                              `pio test -e native`

[platformio]
src_dir = SpotifyDiyThing
default_envs = cyd2usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
; All CYD libraries are vendored under lib/. Keeping lib_deps empty prevents
; PlatformIO mirror/download loops during configuration.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = deep+
; The default -Os costs real frames in the FFT and the visualizer inner loops,
; and there is plenty of flash headroom (~40% used).
build_unflags = -Os

[common_cyd]
build_flags =
	-O2
	-DYELLOW_DISPLAY
	-DUSER_SETUP_LOADED
	-DILI9341_2_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DLOAD_GLCD
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DUSE_HSPI_PORT

[env:cyd]
board_build.partitions = huge_app.csv
build_flags =
	${common_cyd.build_flags}
	-DTFT_INVERSION_OFF

[env:cyd2usb]
board_build.partitions = huge_app.csv
build_flags =
	${common_cyd.build_flags}
	-DTFT_INVERSION_ON

; One-time helper for users without an SD-card reader. Upload this environment
; once to copy the embedded Japanese font onto the card, then upload cyd2usb.
[env:cyd2usb_font_installer]
extends = env:cyd2usb
board_build.embed_files = firmware_assets/jp16.huf
build_flags =
	${env:cyd2usb.build_flags}
	-DHONDATHING_FONT_INSTALLER

; Host build of the modules that carry no Arduino dependency. Covers the
; millis() rollover arithmetic, the bounded string copy, the microphone DSP and
; the sunrise/sunset model - the logic whose failures are otherwise invisible.
;
; Requires a host compiler (g++ or clang) on PATH and the native platform:
;   pio pkg install -g -p native
;   pio test -e native
;
; The same suite also runs on the board with `pio test -e cyd2usb`.
; Uncomment if the project lives inside a synced folder (OneDrive, Dropbox):
;   the sync client intermittently locks .pio and the link step fails with
;   "cannot open map file".
; [platformio]
; build_dir = C:/pio-build/CarDisplay-OS

[env:native]
platform = native
test_framework = unity
build_unflags =
build_src_filter = +<audioSpectrum.cpp> +<solarTime.cpp>
build_flags =
	-std=c++11
	-O2
	-I SpotifyDiyThing

; Same suite compiled for the board, for when no host toolchain is available:
;   pio test -e esp32_test --without-uploading --without-testing   (compile only)
;   pio test -e esp32_test                                          (run on device)
; build_src_filter keeps the sketch out, so the test file owns setup()/loop().
[env:esp32_test]
extends = env:cyd2usb
test_build_src = yes
build_src_filter = +<audioSpectrum.cpp> +<solarTime.cpp>
