; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = SpotifyDiyThing
default_envs = cyd2usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
; All CYD libraries are included in the project's lib folder. Keeping this
; list empty prevents PlatformIO mirror/download loops during configuration.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = deep+

[common_cyd]
build_flags = 
	-DYELLOW_DISPLAY
	-DUSER_SETUP_LOADED
	-DILI9341_2_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DLOAD_GLCD
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
    -DUSE_HSPI_PORT

[env:cyd]
board_build.partitions = huge_app.csv
build_flags = 
	${common_cyd.build_flags}
	-DTFT_INVERSION_OFF

[env:cyd2usb]
board_build.partitions = huge_app.csv
build_flags = 
	${common_cyd.build_flags}
	-DTFT_INVERSION_ON

; One-time helper for users without an SD-card reader. Upload this environment
; once to copy the embedded Japanese font onto the card, then upload cyd2usb.
[env:cyd2usb_font_installer]
extends = env:cyd2usb
board_build.embed_files = firmware_assets/jp16.huf
build_flags =
	${env:cyd2usb.build_flags}
	-DHONDATHING_FONT_INSTALLER
